<!doctype html>
<!--
  The site's Open Graph card, 1200×630. scripts/og/render.mjs screenshots this
  page to packages/docs/public/og.png; edit here, then re-render.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=block"
    />
    <style>
      @font-face {
        font-family: 'Damion';
        src: url('../../packages/ui/src/styles/brand/Damion-latin.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05050a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 70% at 78% 30%, hsl(258 80% 30% / 0.45), transparent 70%),
          radial-gradient(ellipse 55% 60% at 12% 95%, hsl(217 85% 35% / 0.35), transparent 70%),
          radial-gradient(ellipse 40% 45% at 95% 100%, hsl(308 70% 35% / 0.25), transparent 70%),
          linear-gradient(180deg, #07070f 0%, #05050a 100%);
        font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      }
      svg.sky {
        position: absolute;
        inset: 0;
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 36px;
      }
      /* The crescent: black on a white disc, inverted as the dark theme wears it. */
      .mark {
        width: 132px;
        height: 132px;
        background: url('../../packages/ui/src/styles/brand/midnite-logo.png') center / contain
          no-repeat;
        filter: invert(1) drop-shadow(0 0 28px hsl(258 82% 62% / 0.45));
      }
      .wordmark {
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        line-height: 1;
      }
      .brand {
        display: inline-block;
        padding-right: 0.15em;
        font-family: 'Damion', cursive;
        font-size: 168px;
        letter-spacing: 0.025em;
        background-image: linear-gradient(
          100deg,
          hsl(217 95% 58%),
          hsl(235 88% 68%),
          hsl(258 90% 66%),
          hsl(271 91% 65%),
          hsl(285 80% 60%),
          hsl(308 78% 58%)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 3px hsl(258 82% 62% / 0.55))
          drop-shadow(0 0 24px hsl(258 82% 62% / 0.4));
      }
      .product {
        margin-left: 0.15em;
        font-size: 112px;
        font-weight: 500;
        color: hsl(240 5% 72%);
      }
      .tagline {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: hsl(240 5% 62%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="sky" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
        <defs>
          <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="hsl(217 95% 58%)" stop-opacity="0" />
            <stop offset="0.5" stop-color="hsl(258 90% 66%)" stop-opacity="0.55" />
            <stop offset="1" stop-color="hsl(308 78% 58%)" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!-- Two faint orbits sweeping behind the mark. -->
        <ellipse cx="600" cy="330" rx="560" ry="150" fill="none" stroke="url(#orbit)"
          stroke-width="1.5" transform="rotate(-9 600 330)" />
        <ellipse cx="600" cy="330" rx="470" ry="205" fill="none" stroke="url(#orbit)"
          stroke-width="1" opacity="0.6" transform="rotate(7 600 330)" />
        <g id="stars"></g>
      </svg>
      <div class="content">
        <div class="logo">
          <div class="mark"></div>
          <div class="wordmark">
            <span class="brand">Midnite</span><span class="product">UI</span>
          </div>
        </div>
        <div class="tagline">A React design system — primitives, tokens and an app shell</div>
      </div>
    </div>
    <script>
      // A seeded starfield, so every render draws the same sky.
      let seed = 20261112;
      const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32);
      const g = document.getElementById('stars');
      const ns = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 260; i++) {
        const x = rand() * 1200;
        const y = rand() * 630;
        // Thin the stars out behind the wordmark so it stays legible.
        const dx = (x - 600) / 520;
        const dy = (y - 300) / 150;
        const centre = dx * dx + dy * dy < 1;
        const big = rand() < 0.07;
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', x.toFixed(1));
        c.setAttribute('cy', y.toFixed(1));
        c.setAttribute('r', (big ? 1.3 + rand() * 0.9 : 0.4 + rand() * 0.7).toFixed(2));
        const tint = rand();
        c.setAttribute(
          'fill',
          tint < 0.15 ? 'hsl(235 90% 82%)' : tint < 0.25 ? 'hsl(285 80% 85%)' : '#ffffff',
        );
        c.setAttribute('opacity', ((centre ? 0.25 : 1) * (0.25 + rand() * 0.6)).toFixed(2));
        if (big) c.setAttribute('filter', 'drop-shadow(0 0 3px rgba(200,190,255,0.8))');
        g.appendChild(c);
      }
    </script>
  </body>
</html>
