<!doctype html>
<!--
  The site's Open Graph card, 1200×630. scripts/og/render.mjs screenshots this
  page to packages/docs/public/og.jpg; edit here, then re-render. The wordmark,
  ramp, glow and face come from brand.css under its dark theme.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=block"
    />
    <link rel="stylesheet" href="../../packages/ui/src/styles/brand.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05050a;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 70% at 78% 30%, hsl(258 80% 30% / 0.45), transparent 70%),
          radial-gradient(ellipse 55% 60% at 12% 95%, hsl(217 85% 35% / 0.35), transparent 70%),
          radial-gradient(ellipse 40% 45% at 95% 100%, hsl(308 70% 35% / 0.25), transparent 70%),
          linear-gradient(180deg, #07070f 0%, #05050a 100%);
        font-family:
          'Inter',
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      svg.sky {
        position: absolute;
        inset: 0;
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 36px;
      }
      /* The crescent, inverted as the dark theme wears it, with the brand glow. */
      .dark .mark {
        width: 132px;
        height: 132px;
        filter: invert(1)
          drop-shadow(0 0 28px color-mix(in srgb, var(--brand-glow) 45%, transparent));
      }
      /* brand.css sizes "Midnite" at 1.35em of this and spaces "UI" by 0.08em. */
      .wordmark {
        display: flex;
        align-items: baseline;
        font-size: 112px;
      }
      /* The full six-stop ramp, static: the drift's 200% tile would show only half of it. */
      .brand {
        background-image: linear-gradient(
          100deg,
          var(--brand-rainbow-0),
          var(--brand-rainbow-1),
          var(--brand-rainbow-2),
          var(--brand-rainbow-3),
          var(--brand-rainbow-4),
          var(--brand-rainbow-5)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 3px color-mix(in srgb, var(--brand-glow) 55%, transparent))
          drop-shadow(0 0 24px color-mix(in srgb, var(--brand-glow) 40%, transparent));
      }
      /* The dark theme's --muted-foreground. */
      .product {
        color: hsl(240 5% 64.9%);
      }
      .tagline {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.01em;
        color: hsl(240 5% 62%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="sky" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
        <defs>
          <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" style="stop-color: var(--brand-rainbow-0)" stop-opacity="0" />
            <stop offset="0.5" style="stop-color: var(--brand-rainbow-2)" stop-opacity="0.55" />
            <stop offset="1" style="stop-color: var(--brand-rainbow-5)" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!-- Two faint orbits sweeping behind the mark. -->
        <ellipse
          cx="600"
          cy="330"
          rx="560"
          ry="150"
          fill="none"
          stroke="url(#orbit)"
          stroke-width="1.5"
          transform="rotate(-9 600 330)"
        />
        <ellipse
          cx="600"
          cy="330"
          rx="470"
          ry="205"
          fill="none"
          stroke="url(#orbit)"
          stroke-width="1"
          opacity="0.6"
          transform="rotate(7 600 330)"
        />
        <g id="stars"></g>
      </svg>
      <div class="content">
        <div class="logo">
          <div class="mark mui-logo-mark"></div>
          <div class="wordmark mui-wordmark">
            <span class="brand mui-wordmark-brand">Midnite</span
            ><span class="product mui-wordmark-product">UI</span>
          </div>
        </div>
        <div class="tagline">A React design system — primitives, tokens and an app shell</div>
      </div>
    </div>
    <script>
      // A seeded starfield, so every render draws the same sky.
      let seed = 20261112;
      const rand = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
      const g = document.getElementById('stars');
      const ns = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 260; i++) {
        const x = rand() * 1200;
        const y = rand() * 630;
        // Thin the stars out behind the wordmark so it stays legible.
        const dx = (x - 600) / 520;
        const dy = (y - 300) / 150;
        const centre = dx * dx + dy * dy < 1;
        const big = rand() < 0.07;
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', x.toFixed(1));
        c.setAttribute('cy', y.toFixed(1));
        c.setAttribute('r', (big ? 1.3 + rand() * 0.9 : 0.4 + rand() * 0.7).toFixed(2));
        const tint = rand();
        c.setAttribute(
          'fill',
          tint < 0.15 ? 'hsl(235 90% 82%)' : tint < 0.25 ? 'hsl(285 80% 85%)' : '#ffffff',
        );
        c.setAttribute('opacity', ((centre ? 0.25 : 1) * (0.25 + rand() * 0.6)).toFixed(2));
        if (big) c.setAttribute('filter', 'drop-shadow(0 0 3px rgba(200,190,255,0.8))');
        g.appendChild(c);
      }
    </script>
  </body>
</html>
