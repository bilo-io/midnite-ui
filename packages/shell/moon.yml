$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'

# @bilo-io/shell is a MID-TIER package: the wired app frame host apps mount. It
# may depend on `@bilo-io/ui` ONLY (with react/react-dom/react-query/next-intl as
# peers) — never on an app. The boundary test in src/boundary.test.ts enforces
# that edge in CI.
#
# Built with Vite library mode (like @bilo-io/ui) rather than `tsc -b`: it bundles
# JSX/CSS that tsc won't emit. Typechecking still runs via `tsc --noEmit`.
dependsOn:
  - 'ui'

tasks:
  build:
    command: 'pnpm exec vite build'
    deps:
      - 'root:install'
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'package.json'
    outputs:
      - 'dist'

  typecheck:
    command: 'pnpm exec tsc --noEmit'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'

  test:
    command: 'pnpm exec vitest run'
    # Tests import the built @bilo-io/ui (dist), so build deps first.
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'vitest.setup.ts'

  lint:
    command: 'pnpm exec eslint .'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - '/eslint.config.mjs'
