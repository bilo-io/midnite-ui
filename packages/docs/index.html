<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="midnite ui — a React design system: @bilo-io/ui primitives + tokens and the @bilo-io/shell app frame."
    />
    <meta name="theme-color" content="#09090b" />
    <title>Midnite UI · docs</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%92%3C/text%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Midnite UI docs" />
    <meta property="og:url" content="https://bilo-io.github.io/midnite-ui/" />
    <meta property="og:title" content="Midnite UI — design system docs" />
    <meta
      property="og:description"
      content="React primitives + design tokens (@bilo-io/ui) and a wired app shell (@bilo-io/shell)."
    />
    <!--
      No-flash theme init. Mirrors @bilo-io/ui/theme's `themeInitScript` (storage
      key 'midnite.theme'); runs before React so the stored light/dark preference
      is applied before first paint. Kept inline (rather than imported) so the
      docs app stays a plain static HTML entry.
    -->
    <script>
      (function () {
        try {
          var k = 'midnite.theme';
          var s = localStorage.getItem(k);
          var p = s === 'light' || s === 'dark' || s === 'time' ? s : 'system';
          var r;
          if (p === 'system') {
            r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (p === 'time') {
            var h = new Date().getHours();
            r = h >= 8 && h < 18 ? 'light' : 'dark';
          } else {
            r = p;
          }
          var c = document.documentElement.classList;
          if (r === 'dark') c.add('dark');
          else c.remove('dark');
          document.documentElement.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
