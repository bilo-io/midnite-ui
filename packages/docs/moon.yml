$schema: 'https://moonrepo.dev/schemas/project.json'
language: 'typescript'

# The docs app is a pure consumer of @bilo-io/ui + @bilo-io/shell: it mounts the
# shell's <AppFrame> as its own layout (dogfooding = documentation) and renders
# MDX guides with the ui reading primitives. It depends on nothing else —
# enforced by src/boundary.test.ts. Built with Vite (an SPA), so build/dev/
# preview override the repo's default `tsc -b` build.
dependsOn:
  - 'ui'
  - 'shell'

tasks:
  dev:
    command: 'pnpm exec vite'
    preset: 'server'
    # Vite resolves @bilo-io/ui + @bilo-io/shell to their built dist/, so build first.
    deps:
      - 'root:install'
      - '^:build'

  build:
    command: 'pnpm exec vite build'
    # The bundle imports the built libs (dist/ + token CSS), so build them first.
    deps:
      - 'root:install'
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  preview:
    command: 'pnpm exec vite preview'
    preset: 'server'
    deps:
      - '^:build'

  typecheck:
    command: 'pnpm exec tsc --noEmit'
    # tsc resolves the libs via their dist .d.ts, so build them first.
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - 'tsconfig.json'

  test:
    command: 'pnpm exec vitest run'
    # RTL tests import the built libs (dist), so build upstream deps first.
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'vitest.setup.ts'

  lint:
    command: 'pnpm exec eslint .'
    inputs:
      - 'src/**/*'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - '/eslint.config.mjs'
