name: Setup toolchain
description: >-
  Install proto + the pinned node/pnpm/moon toolchain, and the workspace
  dependencies. Shared by every CI job so the install boilerplate lives in one
  place.

runs:
  using: composite
  steps:
    - name: Install proto
      shell: bash
      run: |
        curl -fsSL https://moonrepo.dev/install/proto.sh | bash -s -- --yes
        echo "$HOME/.proto/bin" >> "$GITHUB_PATH"
        echo "$HOME/.proto/shims" >> "$GITHUB_PATH"

    - name: Install pinned toolchain (node, pnpm, moon)
      shell: bash
      run: proto install

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
